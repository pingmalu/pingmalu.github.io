name: 刷新七牛镜像与 CDN

# 在 GitHub Pages 的 pages-build-deployment 成功后再清理七牛镜像并刷新 CDN。
# 替代原来的 GitHub Webhook（https://m1.malu.me/Qiniu/githubhook）。
# 按本次部署对应提交删除七牛 Bucket pingmalu-github-io 里的对象，再刷新 http://git.malu.me。
# 密钥放在仓库 Settings → Secrets and variables → Actions：
#   QINIU_ACCESS_KEY
#   QINIU_SECRET_KEY

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      mode:
        description: home 清理首页和分页；titles 按文章标题清理
        required: true
        default: home
        type: choice
        options:
          - home
          - titles
      titles:
        description: titles 模式填写文章标题，多个用英文逗号分隔，例如 JWT攻击,Python
        required: false
        type: string

concurrency:
  group: qiniu-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: 计算 git 对比范围
        if: github.event_name == 'workflow_run'
        run: |
          AFTER_SHA="${{ github.event.workflow_run.head_sha }}"
          BEFORE_SHA="$(git rev-parse "${AFTER_SHA}^" 2>/dev/null || true)"
          echo "AFTER_SHA=${AFTER_SHA}" >> "$GITHUB_ENV"
          echo "BEFORE_SHA=${BEFORE_SHA}" >> "$GITHUB_ENV"

      - name: 删除对应对象并刷新 CDN
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ env.BEFORE_SHA }}
          AFTER_SHA: ${{ env.AFTER_SHA || github.sha }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TITLES: ${{ inputs.titles }}
        run: python3 .github/scripts/qiniu_purge.py
